name: Deploy Fase Extra to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "fase-extra/source/*.b64"
      - ".github/workflows/deploy-fase-extra.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and validate Fase Extra site
        run: |
          mkdir -p _site
          cat fase-extra/source/part-*.b64 | base64 --decode | tar -xJf - -C _site --strip-components=1
          test -f _site/index.html
          # Prefer the Ocarina of Time gameplay thumbnail hosted by YouTube's image CDN.
          sed -i 's#https://zeldauniverse.net/wp-content/uploads/2018/11/Hyrule-Field-Poe.png#https://i.ytimg.com/vi/Wlb__mo-ai0/maxresdefault.jpg#g' _site/index.html _site/explore.html
          sed -i 's#https://zeldauniverse.net/2018/11/21/tingles-maps-hyrule-field-ocarina-of-time/#https://www.youtube.com/watch?v=Wlb__mo-ai0#g' _site/explore.html
          grep -Fq 'https://i.ytimg.com/vi/Wlb__mo-ai0/maxresdefault.jpg' _site/explore.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
