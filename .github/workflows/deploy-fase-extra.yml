name: Deploy Fase Extra to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "fase-extra/source/*.b64"
      - ".github/workflows/deploy-fase-extra.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Rebuild Fase Extra site
        run: |
          mkdir -p _site
          cat fase-extra/source/part-*.b64 | base64 --decode | tar -xJf - -C _site --strip-components=1
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
